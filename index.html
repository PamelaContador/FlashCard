<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcards de Física – Eletromagnetismo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>⚡ Eletromagnetismo</h1>
    <p class="subtitulo">Flashcards de Física</p>

    <div class="progresso">
      <span id="contador">1 / 1</span>
      <span id="placar">Sei: 0 · Rever: 0</span>
    </div>

    <div class="cena">
      <div class="card" id="card">
        <div class="face frente">
          <span class="rotulo">Pergunta</span>
          <p id="pergunta"></p>
          <small>Clique para virar</small>
        </div>
        <div class="face verso">
          <span class="rotulo">Resposta</span>
          <p id="resposta"></p>
        </div>
      </div>
    </div>

    <div class="botoes">
      <button id="anterior">← Anterior</button>
      <button id="embaralhar">🔀 Embaralhar</button>
      <button id="proximo">Próximo →</button>
    </div>

    <div class="botoes">
      <button id="rever" class="rever">Preciso rever</button>
      <button id="sei" class="sei">Eu sei!</button>
    </div>
  </main>

  <script>
    const cartas = [
      { p: "O que é carga elétrica?", r: "Propriedade da matéria que gera e sofre interações elétricas. Unidade no SI: coulomb (C)." },
      { p: "O que diz a Lei de Coulomb?", r: "A força entre duas cargas é proporcional ao produto das cargas e inversamente proporcional ao quadrado da distância: F = k·q₁·q₂ / d²." },
      { p: "O que é campo elétrico?", r: "Região ao redor de uma carga onde outras cargas sentem força elétrica. E = F / q, em N/C." },
      { p: "O que é a Primeira Lei de Ohm?", r: "U = R · i. A tensão é igual à resistência vezes a corrente elétrica." },
      { p: "Qual a unidade de corrente elétrica?", r: "Ampère (A), equivalente a 1 coulomb por segundo." },
      { p: "O que é potência elétrica?", r: "Energia transformada por unidade de tempo: P = U · i, medida em watts (W)." },
      { p: "O que é um campo magnético?", r: "Região onde ímãs e cargas em movimento sofrem forças magnéticas. Unidade no SI: tesla (T)." },
      { p: "O que diz a Lei de Faraday?", r: "Uma variação do fluxo magnético através de um circuito induz uma força eletromotriz (fem)." },
      { p: "O que diz a Lei de Lenz?", r: "A corrente induzida tem sentido tal que se opõe à variação do fluxo magnético que a produziu." },
      { p: "Como é a força magnética sobre uma carga em movimento?", r: "F = q·v·B·sen θ. A força é perpendicular à velocidade e ao campo." },
      { p: "Em um circuito em série, o que se mantém igual?", r: "A corrente elétrica. A resistência equivalente é a soma das resistências: Req = R₁ + R₂ + ..." },
      { p: "Em um circuito em paralelo, o que se mantém igual?", r: "A tensão. O inverso da resistência equivalente é a soma dos inversos: 1/Req = 1/R₁ + 1/R₂ + ..." }
    ];

    let baralho = [...cartas];
    let indice = 0, sei = 0, rever = 0;

    const card = document.getElementById("card");
    const perguntaEl = document.getElementById("pergunta");
    const respostaEl = document.getElementById("resposta");
    const contador = document.getElementById("contador");
    const placar = document.getElementById("placar");

    function mostrar() {
      card.classList.remove("virado");
      perguntaEl.textContent = baralho[indice].p;
      respostaEl.textContent = baralho[indice].r;
      contador.textContent = (indice + 1) + " / " + baralho.length;
      placar.textContent = "Sei: " + sei + " · Rever: " + rever;
    }

    function proximo() {
      indice = (indice + 1) % baralho.length;
      mostrar();
    }

    card.addEventListener("click", () => card.classList.toggle("virado"));
    document.getElementById("proximo").addEventListener("click", proximo);
    document.getElementById("anterior").addEventListener("click", () => {
      indice = (indice - 1 + baralho.length) % baralho.length;
      mostrar();
    });
    document.getElementById("embaralhar").addEventListener("click", () => {
      baralho.sort(() => Math.random() - 0.5);
      indice = 0;
      mostrar();
    });
    document.getElementById("sei").addEventListener("click", () => { sei++; proximo(); });
    document.getElementById("rever").addEventListener("click", () => { rever++; proximo(); });

    mostrar();
  </script>
</body>
</html>
